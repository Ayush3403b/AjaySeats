<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FAF9F6" />
    <!--
      Static defaults for crawlers and link previews that do not run JavaScript (WhatsApp, Facebook, LinkedIn).
      src/components/Seo.tsx updates every tag below per page and per language once the app loads.
      %SITE_URL% is replaced at build time from VITE_SITE_URL (see seo.plugin.ts).
    -->
    <title>Premium Seat Covers | Custom Car Seat Covers, Made to Order</title>
    <meta name="description" content="Made-to-order car seat covers in leather, leatherette, PVC and fabric. Fitment confirmed for your model, public prices in INR, and quotes in English or Hindi." />
    <meta name="keywords" content="car seat covers, premium seat covers, custom car seat covers, leather seat covers, leatherette seat covers, PVC seat covers, fabric seat covers, made to order seat covers, seat covers India" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Premium Seat Covers" />
    <meta name="application-name" content="Premium Seat Covers" />
    <meta name="apple-mobile-web-app-title" content="Seat Covers" />
    <meta name="format-detection" content="telephone=no" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Premium Seat Covers" />
    <meta property="og:title" content="Premium Seat Covers | Custom Car Seat Covers, Made to Order" />
    <meta property="og:description" content="Made-to-order car seat covers in leather, leatherette, PVC and fabric. Fitment confirmed for your model, public prices in INR, and quotes in English or Hindi." />
    <meta property="og:image" content="%SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Premium Seat Covers: made-to-order car seat covers in leather, leatherette, PVC and fabric" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:locale:alternate" content="hi_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Premium Seat Covers | Custom Car Seat Covers, Made to Order" />
    <meta name="twitter:description" content="Made-to-order car seat covers in leather, leatherette, PVC and fabric. Fitment confirmed for your model, public prices in INR, and quotes in English or Hindi." />
    <meta name="twitter:image" content="%SITE_URL%/og-image.png" />
    <meta name="twitter:image:alt" content="Premium Seat Covers: made-to-order car seat covers in leather, leatherette, PVC and fabric" />

    <!-- Site-wide structured data: the business (shown in the header on every page) and its catalogue search. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%SITE_URL%/#organization",
            "name": "Premium Seat Covers",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-512.png",
            "description": "Made-to-order car seat covers in leather, leatherette, PVC and fabric."
          },
          {
            "@type": "WebSite",
            "@id": "%SITE_URL%/#website",
            "name": "Premium Seat Covers",
            "url": "%SITE_URL%/",
            "inLanguage": ["en-IN", "hi-IN"],
            "publisher": { "@id": "%SITE_URL%/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": { "@type": "EntryPoint", "urlTemplate": "%SITE_URL%/products?q={search_term_string}" },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@500;600;700&family=Pinyon+Script&family=Sancreek&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.6; color: #111827">
        <h1>Premium Seat Covers</h1>
        <p>Made-to-order car seat covers in leather, leatherette, PVC and fabric. We confirm fitment for your car’s make, model and year before anything is made, show public list prices in INR, and send quotations in English or Hindi.</p>
        <p>Please enable JavaScript to browse the catalogue and request a quote.</p>
        <ul>
          <li><a href="/products">Seat cover catalogue</a></li>
          <li><a href="/materials">Materials guide: leather, leatherette, PVC and fabric</a></li>
          <li><a href="/request-quote">Request a quote</a></li>
          <li><a href="/contact">Contact us</a></li>
        </ul>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
